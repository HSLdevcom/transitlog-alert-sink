name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ci-cd:
    uses: HSLdevcom/transitdata-shared-workflows/.github/workflows/ci-cd-java.yml@234db0afad207e5af97e17e597b9f0933d22b4c0
    permissions:
      contents: read
      packages: read
    with:
      runTestsInsideDocker: true
    secrets:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
